<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seating Grid View - Exam Seating System</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/seating.css">
</head>
<body>

<div class="app-layout">
    <!-- Sidebar Navigation -->
    <aside class="app-sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">ES</div>
            <div class="sidebar-title">
                <h3>ExamSeat</h3>
                <p>Admin Portal</p>
            </div>
        </div>

        <nav class="sidebar-menu">
            <a href="dashboard.html" class="nav-link"><i class="ri-dashboard-line"></i> <span>Dashboard</span></a>
            <a href="students.html" class="nav-link"><i class="ri-user-group-line"></i> <span>Students</span></a>
            <a href="exams.html" class="nav-link"><i class="ri-calendar-event-line"></i> <span>Exams</span></a>
            <a href="rooms.html" class="nav-link"><i class="ri-community-line"></i> <span>Halls & Rooms</span></a>
            <a href="generate.html" class="nav-link"><i class="ri-magic-line"></i> <span>Generate Seating</span></a>
            <a href="arrangement.html" class="nav-link active"><i class="ri-grid-line"></i> <span>Seating Grid</span></a>
            <a href="reports.html" class="nav-link"><i class="ri-file-chart-line"></i> <span>Reports</span></a>
        </nav>

        <div class="sidebar-footer">
            <button class="btn-logout" onclick="logout()"><i class="ri-logout-box-r-line"></i> <span>Logout</span></button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="app-main">
        <header class="app-topbar">
            <div class="page-title">
                <h1>Visual Seating Arrangement Grid</h1>
                <p>Interactive examination hall seat map view with candidate assignments and print charts.</p>
            </div>

            <div class="topbar-actions">
                <button class="btn btn-secondary no-print" onclick="window.print()">
                    <i class="ri-printer-line"></i> Print All Charts
                </button>
            </div>
        </header>

        <!-- Filter Toolbar -->
        <div class="toolbar-card no-print">
            <div class="filter-group">
                <label style="font-size:13px; font-weight:600;">Filter Exam:</label>
                <select id="arrangementExamSelect">
                    <!-- Populated by JS -->
                </select>
            </div>

            <div class="filter-group">
                <label style="font-size:13px; font-weight:600;">Filter Room:</label>
                <select id="arrangementRoomSelect">
                    <!-- Populated by JS -->
                </select>
            </div>
        </div>

        <!-- Seating Grid Container -->
        <div id="arrangementGridContainer">
            <!-- Rendered by JS -->
        </div>
    </main>
</div>

<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/seating.js"></script>
</body>
</html>
