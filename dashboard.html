<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Exam Seating System</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/seating.css">
</head>
<body style="background:#f8fafc;">

<div style="max-width:1100px; margin:0 auto; padding:30px 20px;">
    <!-- Student Header -->
    <header style="display:flex; justify-content:space-between; align-items:center; background:#ffffff; padding:20px 30px; border-radius:16px; box-shadow:var(--shadow-sm); border:1px solid var(--border-color); margin-bottom:30px;">
        <div style="display:flex; align-items:center; gap:16px;">
            <div style="width:48px; height:48px; border-radius:12px; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:22px;">
                ES
            </div>
            <div>
                <h2 style="font-size:22px; font-weight:800;" id="studentWelcomeName">Welcome, Student</h2>
                <p style="font-size:13px; color:var(--text-muted);" id="studentSubTitle">Register No: Candidate</p>
            </div>
        </div>

        <button class="btn btn-secondary" onclick="logout()">
            <i class="ri-logout-box-r-line"></i> Logout
        </button>
    </header>

    <!-- Seat Finder Lookup Form -->
    <div class="toolbar-card" style="margin-bottom:30px;">
        <form id="studentLookupForm" style="display:flex; align-items:center; gap:16px; width:100%; flex-wrap:wrap;">
            <div style="flex:1; min-width:260px;">
                <label style="font-size:13px; font-weight:700; display:block; margin-bottom:6px;">Your Register Number:</label>
                <input type="text" id="lookupRegisterNo" style="width:100%; padding:10px 14px; border:1px solid var(--border-color); border-radius:8px; font-weight:700;" required>
            </div>
            <button type="submit" class="btn btn-primary" style="margin-top:22px; padding:11px 24px;">
                <i class="ri-search-eye-line"></i> Search Seat Allocation
            </button>
        </form>
    </div>

    <!-- Results Card (Seat Info) -->
    <div id="studentSeatResult">
        <!-- Rendered by JS -->
    </div>

    <!-- Visual Mini Grid Plan -->
    <div id="studentMiniGridContainer">
        <!-- Rendered by JS -->
    </div>
</div>

<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/seating.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const regNo = checkStudentAuth();
    const students = getStudents();
    const currentStudent = students.find(s => s.register.toUpperCase() === regNo.toUpperCase());

    if (currentStudent) {
        document.getElementById('studentWelcomeName').textContent = `Welcome, ${currentStudent.name}`;
        document.getElementById('studentSubTitle').textContent = `Register No: ${currentStudent.register} | Department: ${currentStudent.department} | ${currentStudent.semester}`;
    }
});
</script>
</body>
</html>
