<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Directory - Exam Seating System</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/seating.css">
</head>
<body>

<div class="app-layout">
    <!-- Sidebar Navigation -->
    <aside class="app-sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">ES</div>
            <div class="sidebar-title">
                <h3>ExamSeat</h3>
                <p>Admin Portal</p>
            </div>
        </div>

        <nav class="sidebar-menu">
            <a href="dashboard.html" class="nav-link"><i class="ri-dashboard-line"></i> <span>Dashboard</span></a>
            <a href="students.html" class="nav-link active"><i class="ri-user-group-line"></i> <span>Students</span></a>
            <a href="exams.html" class="nav-link"><i class="ri-calendar-event-line"></i> <span>Exams</span></a>
            <a href="rooms.html" class="nav-link"><i class="ri-community-line"></i> <span>Halls & Rooms</span></a>
            <a href="generate.html" class="nav-link"><i class="ri-magic-line"></i> <span>Generate Seating</span></a>
            <a href="arrangement.html" class="nav-link"><i class="ri-grid-line"></i> <span>Seating Grid</span></a>
            <a href="reports.html" class="nav-link"><i class="ri-file-chart-line"></i> <span>Reports</span></a>
        </nav>

        <div class="sidebar-footer">
            <button class="btn-logout" onclick="logout()"><i class="ri-logout-box-r-line"></i> <span>Logout</span></button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="app-main">
        <header class="app-topbar">
            <div class="page-title">
                <h1>Student Management</h1>
                <p>Register, search, and manage candidate student records.</p>
            </div>

            <div class="topbar-actions">
                <button class="btn btn-primary" onclick="openModal('addStudentModal')">
                    <i class="ri-user-add-line"></i> Add New Student
                </button>
            </div>
        </header>

        <div id="studentAlertContainer"></div>

        <!-- Filter & Search Toolbar -->
        <div class="toolbar-card">
            <div class="search-box">
                <i class="ri-search-line search-icon"></i>
                <input type="text" id="studentSearch" placeholder="Search by Register No or Name...">
            </div>

            <div class="filter-group">
                <label style="font-size:13px; font-weight:600;">Department:</label>
                <select id="deptFilter">
                    <option value="ALL">All Departments</option>
                    <option value="CSE">Computer Science (CSE)</option>
                    <option value="ECE">Electronics (ECE)</option>
                    <option value="ME">Mechanical (ME)</option>
                    <option value="EEE">Electrical (EEE)</option>
                </select>
            </div>
        </div>

        <!-- Student Table -->
        <div class="table-card">
            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Register Number</th>
                            <th>Student Name</th>
                            <th>Department</th>
                            <th>Semester</th>
                            <th>Email Address</th>
                            <th style="text-align:right;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="studentsTableBody">
                        <!-- Rendered by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<!-- Modal: Add Student -->
<div class="modal-backdrop" id="addStudentModal">
    <div class="modal">
        <div class="modal-header">
            <h3>Add New Student</h3>
            <button class="modal-close" onclick="closeModal('addStudentModal')">&times;</button>
        </div>
        <form id="addStudentForm">
            <div class="modal-body">
                <div class="form-field">
                    <label for="newRegister">Register Number *</label>
                    <input type="text" id="newRegister" placeholder="e.g. NCE25CS099" required>
                </div>
                <div class="form-field">
                    <label for="newName">Full Name *</label>
                    <input type="text" id="newName" placeholder="Enter full name" required>
                </div>
                <div class="form-grid-2">
                    <div class="form-field">
                        <label for="newDept">Department / Branch *</label>
                        <select id="newDept" required>
                            <option value="CSE">CSE</option>
                            <option value="ECE">ECE</option>
                            <option value="ME">ME</option>
                            <option value="EEE">EEE</option>
                        </select>
                    </div>
                    <div class="form-field">
                        <label for="newSemester">Semester *</label>
                        <select id="newSemester" required>
                            <option value="S1">S1</option>
                            <option value="S2">S2</option>
                            <option value="S3">S3</option>
                            <option value="S4">S4</option>
                            <option value="S5">S5</option>
                            <option value="S6" selected>S6</option>
                            <option value="S7">S7</option>
                            <option value="S8">S8</option>
                        </select>
                    </div>
                </div>
                <div class="form-field">
                    <label for="newEmail">Email Address</label>
                    <input type="email" id="newEmail" placeholder="student@example.com">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal('addStudentModal')">Cancel</button>
                <button type="submit" class="btn btn-primary">Save Student Record</button>
            </div>
        </form>
    </div>
</div>

<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/students.js"></script>
</body>
</html>
